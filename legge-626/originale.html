<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legge 626 · versione originale (Flash)</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0f1520;color:#e6ecf5;font:16px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box}
  #stage{width:min(100%,880px);aspect-ratio:550/400;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #stage ruffle-player{width:100%;height:100%;display:block}
  a{color:#9cc1ff} p{margin:0;text-align:center;max-width:60ch;color:#9aa8bb;font-size:14px}
</style>
</head>
<body>
<div id="stage"></div>
<p>Il progetto Flash originale, riprodotto senza plugin con l'emulatore <a href="https://ruffle.rs">Ruffle</a>. Va aperto da un sito web (http/https), non direttamente dal file. · <a href="index.html">← Torna alla presentazione</a></p>
<script>window.RufflePlayer = { config: { autoplay: "auto", unmuteOverlay: "visible", letterbox: "on", warnOnUnsupportedContent: false } };</script>
<script src="ruffle/ruffle.js"></script>
<script>
  addEventListener("load", () => {
    const player = window.RufflePlayer.newest().createPlayer();
    document.getElementById("stage").appendChild(player);
    player.load("flash/626.swf");
  });
</script>
</body>
</html>
